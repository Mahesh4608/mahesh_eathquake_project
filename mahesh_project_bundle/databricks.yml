bundle:
  name: mahesh_project_bundle
  uuid: 1256e8c3-b5f2-4568-8d88-c971d431b6c8

include:
  - resources/*.yml
  - resources/*/*.yml

# ----------------------------
# VARIABLE DEFINITIONS
# ----------------------------
variables:
  catalog:
    description: "The catalog to use"

  schema:
    description: "The schema to use"

  warehouse_id:
    description: "SQL Warehouse ID used for dashboards"

# ----------------------------
# TARGETS
# ----------------------------
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a119c061-6309.cloud.databricks.com

    variables:
      catalog: "mahesh_dev"
      schema: "dev"
      warehouse_id: "fd245cb4f44f5514"

    presets:
      artifacts_dynamic_version: true

  prod:
    mode: production
    workspace:
      host: https://dbc-a119c061-6309.cloud.databricks.com
      root_path: /Workspace/Users/m.rathod4608@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: "mahesh_prod"
      schema: "prod"
      warehouse_id: "fd245cb4f44f5514"

    permissions:
      - user_name: m.rathod4608@gmail.com
        level: CAN_MANAGE
