resources:
  jobs:
    mahesh_earthquake_end_end_job:
      name: mahesh_earthquake_end_end_job
      tasks:
        - task_key: ingestion_bronze
          notebook_task:
            notebook_path: ../src/notebooks/ingetion_bronze.ipynb
            base_parameters:
              catalog_name: ${var.catalog}
            source: WORKSPACE
        - task_key: cleaned_earthqauke_data
          depends_on:
            - task_key: ingestion_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_silver_earthquake_etl.id}
            full_refresh: false
        - task_key: EarthQuake_dashboard
          depends_on:
            - task_key: cleaned_earthqauke_data
          dashboard_task:
            subscription: {}
            warehouse_id: "fd245cb4f44f5514" 
            dashboard_id: ${resources.dashboards.earthquake_monitor.id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
